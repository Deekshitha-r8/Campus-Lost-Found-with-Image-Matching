<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-3); margin: var(--space-5) 0 var(--space-6); }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <p class="eyebrow">Your campus desk</p>
    <h1>Welcome, <span id="user-name">there</span></h1>
    <p id="page-error" class="alert alert-danger hidden"></p>

    <section class="stat-grid">
      <div class="stat-tile"><span class="value" id="item-count">–</span><span class="label">My reports</span></div>
      <div class="stat-tile"><span class="value" id="lost-count">–</span><span class="label">Lost</span></div>
      <div class="stat-tile"><span class="value" id="found-count">–</span><span class="label">Found</span></div>
      <div class="stat-tile"><span class="value" id="notification-count">–</span><span class="label">Unread notifications</span></div>
    </section>

    <div class="action-grid">
      <a class="btn btn-primary" href="report-form.html?type=LOST">Report lost item</a>
      <a class="btn btn-primary" href="report-form.html?type=FOUND">Report found item</a>
      <a class="btn btn-outline" href="browse.html">Browse reports</a>
      <a class="btn btn-outline" href="matches.html">My matches</a>
      <a class="btn btn-outline" href="messages.html">Messages</a>
      <a class="btn btn-outline" href="settings.html">Settings</a>
    </div>

    <h2>Recent reports</h2>
    <div id="recent-reports"><div class="loading-state">Loading…</div></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
